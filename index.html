<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>拼死跳跃 / Die to Jump</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a;color:#aac4d6;font-family:'Courier New',monospace;font-size:14px;user-select:none;-webkit-user-select:none;position:fixed;touch-action:manipulation}
button,input,select,textarea{font-family:inherit;-webkit-appearance:none;appearance:none}
#app{display:flex;flex-direction:column;width:100%;height:100%;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#header{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#0f1420;border-bottom:1px solid #1a2a3a;min-height:52px;flex-wrap:nowrap;flex:0 0 auto;position:relative;z-index:20;overflow-x:auto}
#header::-webkit-scrollbar{height:0}
#header .logo{font-weight:bold;color:#00ffaa;font-size:16px;letter-spacing:2px;white-space:nowrap;flex-shrink:0}
.tabs{display:flex;gap:2px;background:#0a0e1a;border:1px solid #1a2a3a;border-radius:4px;padding:2px;flex-shrink:0}
.tab{padding:7px 12px;border-radius:3px;cursor:pointer;color:#5a6a7a;font-size:13px;letter-spacing:1px;white-space:nowrap}
.tab.active{background:rgba(0,255,170,.15);color:#00ffaa}
#header .sep{width:1px;height:24px;background:#1a2a3a;flex-shrink:0}
#levelSelect{background:#0a0e1a;color:#aac4d6;border:1px solid #2a3a4a;border-radius:3px;padding:6px 8px;font-size:13px;outline:none;cursor:pointer;max-width:120px;flex-shrink:0}
#levelNameInput{background:#0a0e1a;color:#aac4d6;border:1px solid #2a3a4a;border-radius:3px;padding:6px 8px;font-size:13px;outline:none;width:90px;flex-shrink:0}
#lvLives,#lvFlags{background:#0a0e1a;color:#aac4d6;border:1px solid #2a3a4a;border-radius:3px;padding:6px 4px;font-size:13px;outline:none;width:42px;flex-shrink:0;text-align:center}
#chamberRef{background:#0a0e1a;color:#aac4d6;border:1px solid #2a3a4a;border-radius:3px;padding:6px 6px;font-size:13px;outline:none;max-width:100px;flex-shrink:0}
#header .right{margin-left:auto;display:flex;gap:4px;flex-shrink:0;padding-left:6px}
.tb-btn{background:transparent;border:1px solid #2a3a4a;color:#aac4d6;font-size:13px;padding:7px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;min-height:36px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-btn:hover{background:rgba(0,255,170,.08);color:#00ffaa}
.tb-btn.primary{background:#00ffaa;color:#0a0e1a;border-color:#00ffaa;font-weight:bold}
.tb-btn.primary:hover{background:#00ddaa}
.tb-btn.play{background:#ffaa00;color:#0a0e1a;border-color:#ffaa00;font-weight:bold}
.tb-btn.danger{color:#ff4466}
.tb-btn.danger:hover{background:rgba(255,68,102,.12);color:#ff4466}
.tb-btn .icon{font-size:17px;line-height:1}
.page{display:none;flex:1 1 auto;min-height:0;overflow:hidden;flex-direction:column}
.page.active{display:flex}
#editPage.active{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
#main{display:flex;flex:1 1 auto;min-height:0;overflow:hidden;position:relative}
#palette{width:200px;background:#0f1420;border-right:1px solid #1a2a3a;padding:8px;overflow-y:auto;flex-shrink:0}
.pal-section{font-size:11px;color:#5a6a7a;letter-spacing:1px;padding:10px 6px 6px;margin-top:8px;border-top:1px solid #1a2a3a}
.pal-section:first-child{margin-top:0;border-top:none}
.pal-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:4px;cursor:pointer;color:#aac4d6;font-size:13px;min-height:42px}
.pal-item:hover{background:rgba(0,255,170,.06)}
.pal-item.active{background:rgba(0,255,170,.15);color:#00ffaa;box-shadow:inset 0 0 0 1px #00ffaa}
.pal-icon{width:22px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shape{display:block}
.shape.platform{width:22px;height:6px;background:#e0d0ff;border-radius:1px}
.shape.spike{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #ff3366}
.shape.goal{width:12px;height:12px;background:#ff4466;border:1px solid #ff8899}
.shape.spawn{width:10px;height:10px;background:#00ffaa;border-radius:50%}
.shape.plate{width:18px;height:5px;background:#ffaa00;border-radius:1px}
.shape.door{width:8px;height:15px;background:#ffaa00;border-radius:1px}
.shape.laser-r,.shape.laser-l{width:18px;height:5px;background:#ff3366;border-radius:1px}
.shape.laser-u,.shape.laser-d{width:5px;height:18px;background:#ff3366;border-radius:1px}
.shape.movable{width:13px;height:13px;background:#5588cc;border:1px solid #7799dd}
.shape.breakable{width:13px;height:13px;background:#cc7744;border:1px dashed #884422}
.shape.flammable{width:13px;height:13px;background:#cc5522;border:1px solid #ff8844}
.shape.disappear{width:18px;height:6px;background:rgba(224,208,255,.4);border:1px dashed #6a6a8a}
.shape.flag{width:10px;height:13px;background:#ffdd44;clip-path:polygon(0 0,100% 25%,0 50%,0 100%,0 0)}
.shape.heart{width:13px;height:12px;background:#ff3366;clip-path:polygon(50% 100%,0 35%,0 20%,15% 0,50% 20%,85% 0,100% 20%,100% 35%)}
.shape.gravity{width:18px;height:18px;border:1px dashed #aa88ff;background:rgba(170,136,255,.15)}
.shape.fallspike{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:11px solid #ff3366}
.shape.label{width:20px;height:10px;background:#ffffff;border-radius:1px;position:relative}
.shape.label::after{content:'T';position:absolute;color:#0a0e1a;font-size:9px;font-weight:bold;top:-1px;left:6px}
.shape.bg{width:22px;height:15px;background:linear-gradient(135deg,#5a1a8a,#0a0e1a);border:1px solid #aa44ff;border-radius:2px}
.shape.labeltrig{width:15px;height:15px;border:1px dashed #ffdd44;background:rgba(255,221,68,.15);border-radius:50%}
#canvasWrap{flex:1 1 auto;position:relative;overflow:hidden;background:#060810;min-width:0;min-height:0;touch-action:none;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:20px 20px;}
#canvas{display:block;position:absolute;top:0;left:0;image-rendering:pixelated;cursor:crosshair;touch-action:none}
#layerCtrl{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;background:rgba(15,20,32,.94);border:1px solid #2a3a4a;border-radius:5px;padding:5px 8px;z-index:4;flex-wrap:wrap;max-width:calc(100% - 260px)}
#layerCtrl .lbl{font-size:12px;color:#5a6a7a;padding-right:4px;white-space:nowrap}
#layerCtrl #layerList{display:flex;gap:4px;flex-wrap:wrap}
#layerCtrl button{background:transparent;border:1px solid #2a3a4a;color:#aac4d6;font-size:12px;padding:5px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;line-height:1.3;min-height:28px}
#layerCtrl button:hover{background:rgba(0,255,170,.08);color:#00ffaa}
#layerCtrl button.active{background:rgba(0,255,170,.18);color:#00ffaa;border-color:#00ffaa;font-weight:bold}
#layerCtrl button.bg-active{background:rgba(170,68,255,.22);color:#cc88ff;border-color:#aa44ff;font-weight:bold}
#layerCtrl button.layer-add{color:#00ffaa;border-color:#00aa66}
#layerCtrl button.layer-del{color:#ff4466;border-color:#aa2244}
#zoomControls{position:absolute;right:10px;top:10px;display:flex;gap:2px;background:rgba(15,20,32,.94);border:1px solid #2a3a4a;border-radius:5px;padding:3px;z-index:3}
#zoomControls button{width:36px;height:36px;background:transparent;border:none;color:#aac4d6;cursor:pointer;font-size:16px;border-radius:3px}
#zoomControls button:hover{background:rgba(0,255,170,.1);color:#00ffaa}
#zoomVal{color:#5a6a7a;font-size:12px;padding:0 6px;line-height:36px;min-width:52px;text-align:center}
#chamberCtrl{position:absolute;right:10px;top:58px;display:flex;flex-direction:column;gap:3px;background:rgba(15,20,32,.94);border:1px solid #2a3a4a;border-radius:5px;padding:5px;z-index:3}
#chamberCtrl button{min-width:64px;height:32px;background:transparent;border:none;color:#aac4d6;cursor:pointer;font-size:12px;border-radius:3px;padding:0 8px;white-space:nowrap}
#chamberCtrl button:hover{background:rgba(0,255,170,.12);color:#00ffaa}
#chamberCtrl button.danger{color:#ff4466}
#chamberCtrl button.danger:hover{background:rgba(255,68,102,.15);color:#ff4466}
#chamberCtrl .lbl{font-size:11px;color:#5a6a7a;text-align:center;padding:3px}
#inspector{width:250px;background:#0f1420;border-left:1px solid #1a2a3a;padding:12px;overflow-y:auto;flex-shrink:0;display:none}
#inspector.show{display:block}
.ins-title{font-size:12px;color:#5a6a7a;padding-bottom:8px;border-bottom:1px solid #1a2a3a;margin-bottom:10px;letter-spacing:1px}
.ins-empty{color:#3a4a5a;font-size:13px;text-align:center;padding:24px 0}
.ins-desc{background:rgba(0,255,170,.06);border-left:2px solid #00ffaa;padding:8px 10px;font-size:12px;color:#88ccbb;line-height:1.6;border-radius:0 3px 3px 0;margin-bottom:10px}
.ins-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13px}
.ins-row label{width:82px;color:#5a6a7a;flex-shrink:0;font-size:12px}
.ins-row input,.ins-row select{flex:1;background:#0a0e1a;color:#c0d0e0;border:1px solid #2a3a4a;border-radius:3px;padding:7px 8px;font-size:13px;outline:none;min-width:0;width:100%}
.ins-btn{width:100%;padding:9px;background:transparent;border:1px solid #2a3a4a;color:#aac4d6;border-radius:3px;cursor:pointer;font-size:13px;margin-top:5px;min-height:38px}
.ins-btn:hover{border-color:#00ffaa;color:#00ffaa}
.ins-btn.danger:hover{border-color:#ff4466;color:#ff4466}
.ins-hint{font-size:12px;color:#5a6a7a;line-height:1.7;padding:6px 0;background:rgba(255,170,0,.06);border-left:2px solid #ffaa00;padding-left:10px;margin-top:8px}
#typeBadge{display:inline-block;padding:3px 10px;border-radius:3px;font-size:12px;font-weight:bold;margin-bottom:8px;background:rgba(0,255,170,.15);color:#00ffaa}
.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13px}
.slider-row label{width:82px;color:#5a6a7a;flex-shrink:0;font-size:12px}
.slider-row input[type=range]{flex:1;accent-color:#00ffaa;height:28px;cursor:pointer}
.slider-row .slider-val{width:54px;text-align:right;color:#00ffaa;font-size:13px;font-variant-numeric:tabular-nums}
#selectionBar{display:none;position:absolute;left:12px;right:12px;bottom:86px;height:54px;background:rgba(15,20,32,.96);border:1px solid #2a3a4a;border-radius:10px;padding:0 14px;z-index:8;align-items:center;gap:12px;box-shadow:0 6px 16px rgba(0,0,0,.6)}
#selectionBar.show{display:flex}
#selectionBar .sel-type{color:#00ffaa;font-weight:bold;font-size:14px;padding:4px 10px;border-radius:4px;background:rgba(0,255,170,.15);flex-shrink:0}
#selectionBar .sel-info{flex:1;color:#aac4d6;font-size:13px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
#selectionBar .sel-info .line1{color:#c0d0e0;font-size:14px}
#selectionBar .sel-info .line2{color:#5a6a7a;font-size:12px}
#selectionBar .sel-edit{width:42px;height:42px;border-radius:50%;background:rgba(0,255,170,.15);border:1px solid #00ffaa;color:#00ffaa;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#selectionBar .sel-close{width:38px;height:38px;border-radius:50%;background:transparent;border:1px solid #2a3a4a;color:#5a6a7a;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#propertySheet{display:none;position:fixed;inset:0;background:#0a0e1a;z-index:500;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#propertySheet.show{display:flex}
.ps-header{display:flex;align-items:center;padding:14px 18px;background:#0f1420;border-bottom:1px solid #1a2a3a;min-height:64px;flex-shrink:0}
.ps-header .ps-title{flex:1;color:#00ffaa;font-size:18px;font-weight:bold;letter-spacing:2px}
.ps-header .ps-title small{display:block;color:#5a6a7a;font-size:12px;font-weight:normal;letter-spacing:0;margin-top:3px}
.ps-header .ps-close{width:44px;height:44px;border-radius:50%;background:transparent;border:1px solid #2a3a4a;color:#aac4d6;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ps-body{flex:1 1 auto;overflow-y:auto;padding:18px}
.ps-hint{background:rgba(0,255,170,.06);border-left:2px solid #00ffaa;padding:12px 14px;font-size:13px;color:#88ccbb;line-height:1.7;border-radius:0 4px 4px 0;margin-bottom:18px}
.ps-group{margin-bottom:18px}
.ps-group-title{font-size:12px;color:#5a6a7a;letter-spacing:1px;padding-bottom:10px;border-bottom:1px dashed #1a2a3a;margin-bottom:14px}
.ps-field{margin-bottom:16px}
.ps-field-label{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#c0d0e0;margin-bottom:10px}
.ps-field-label .val{color:#00ffaa;font-size:15px;font-weight:bold}
.ps-field-label .val input{width:92px;background:#0a0e1a;color:#00ffaa;border:1px solid #2a3a4a;border-radius:4px;padding:8px 10px;font-size:15px;font-weight:bold;text-align:right;outline:none}
.ps-slider{width:100%;height:40px;accent-color:#00ffaa;cursor:pointer}
.ps-text-input{width:100%;background:#0a0e1a;color:#c0d0e0;border:1px solid #2a3a4a;border-radius:4px;padding:12px 14px;font-size:15px;outline:none}
.ps-select{width:100%;background:#0a0e1a;color:#c0d0e0;border:1px solid #2a3a4a;border-radius:4px;padding:12px 14px;font-size:15px;outline:none}
.ps-color-wrap{display:flex;gap:10px;align-items:center}
.ps-color{width:56px;height:40px;padding:2px;border:1px solid #2a3a4a;border-radius:4px;background:#0a0e1a;cursor:pointer;flex-shrink:0}
.ps-color-text{flex:1;min-width:0;background:#0a0e1a;color:#c0d0e0;border:1px solid #2a3a4a;border-radius:4px;padding:10px 12px;font-size:14px;outline:none;font-family:'Courier New',monospace}
.ins-row .color-pick-wrap{display:flex;gap:6px;align-items:center;flex:1;min-width:0}
.ins-row .color-pick-wrap input[type=color]{width:44px;height:32px;padding:2px;border:1px solid #2a3a4a;border-radius:3px;background:#0a0e1a;cursor:pointer;flex-shrink:0}
.ins-row .color-pick-wrap input[type=text]{flex:1;min-width:0;background:#0a0e1a;color:#c0d0e0;border:1px solid #2a3a4a;border-radius:3px;padding:6px 8px;font-size:12px;outline:none;font-family:'Courier New',monospace}
.ps-footer{display:flex;gap:8px;padding:14px 18px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:#0f1420;border-top:1px solid #1a2a3a;flex-shrink:0}
.ps-footer button{flex:1;padding:16px 18px;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer;border:1px solid #2a3a4a;background:transparent;color:#aac4d6;letter-spacing:1px}
.ps-footer button.danger{border-color:#ff4466;color:#ff4466}
#status{display:flex;align-items:center;gap:14px;padding:7px 12px;background:#0f1420;border-top:1px solid #1a2a3a;height:30px;font-size:12px;color:#5a6a7a;flex-shrink:0;flex-wrap:wrap;flex:0 0 auto;overflow:hidden}
#status .k{color:#2a3a4a}
#status .v{color:#aac4d6}
#status .right{margin-left:auto;display:flex;gap:14px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,255,170,.15);color:#00ffaa;border:1px solid #00ffaa;border-radius:5px;padding:10px 22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:1000;white-space:nowrap}
#toast.show{opacity:1}
#playScreen{position:fixed;inset:0;background:#0a0e1a;z-index:200;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#playScreen.active{display:flex}
#playHeader{display:flex;align-items:center;padding:8px 12px;background:rgba(15,20,32,.98);border-bottom:1px solid #1a2a3a;gap:10px;font-size:14px;min-height:52px;flex:0 0 auto}
#playHeader .lbl{color:#ffaa00;font-weight:bold;letter-spacing:2px;font-size:16px}
#playHeader .info{color:#5a6a7a;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#playHeader .right{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
#playCanvasWrap{flex:1;position:relative;overflow:hidden;background:#060810;min-height:0;touch-action:none}
#playCanvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#playWin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,255,170,.15);border:1px solid #00ffaa;color:#00ffaa;border-radius:6px;padding:20px 40px;font-size:20px;letter-spacing:3px;font-weight:bold;display:none;pointer-events:none;z-index:5}
#playWin.show{display:block}
#playFreeLookHint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(15,20,32,.92);border:1px solid #2a3a4a;border-radius:4px;padding:8px 18px;font-size:13px;color:#aac4d6;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6;white-space:nowrap}
#playFreeLookHint.show{opacity:1}
#playControls{position:fixed;inset:0;display:none;pointer-events:none;z-index:10;touch-action:none}
#playControls.active{display:block}
.pc-zone{position:absolute;bottom:0;pointer-events:none}
.pc-zone.left{left:0;width:50%;height:240px}
.pc-zone.right{right:0;width:50%;height:280px}
.pc-btn{position:absolute;border-radius:50%;background:linear-gradient(145deg,rgba(30,30,60,.85),rgba(15,20,40,.85));border:2px solid rgba(224,208,255,.5);color:#e0d0ff;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.6)}
.pc-btn.pressed{background:rgba(0,255,170,.35);border-color:#00ffaa;color:#00ffaa;transform:scale(.9)}
.pc-btn.dir{border-radius:14px;font-size:26px;width:68px;height:68px}
.pc-btn.jump{width:88px;height:88px;font-size:16px;border-color:#00ffaa;color:#00ffaa;border-width:3px}
.pc-btn.slow{width:60px;height:60px;border-color:#4488ff;color:#4488ff;font-size:14px}
.pc-btn.flag{border-color:#ff44ff;color:#ff44ff;width:60px;height:60px}
.pc-btn.die{border-color:#ff4444;color:#ff4444;width:60px;height:60px}
.pc-btn.reset{border-color:#aa44ff;color:#aa44ff;width:60px;height:60px}
.pc-zone.left .dir.btn-l{left:16px;bottom:calc(16px + env(safe-area-inset-bottom))}
.pc-zone.left .dir.btn-r{left:96px;bottom:calc(16px + env(safe-area-inset-bottom))}
.pc-zone.right .slow{right:16px;bottom:calc(194px + env(safe-area-inset-bottom))}
.pc-zone.right .jump{right:16px;bottom:calc(16px + env(safe-area-inset-bottom))}
.pc-zone.right .flag{right:118px;bottom:calc(16px + env(safe-area-inset-bottom))}
.pc-zone.right .die{right:16px;bottom:calc(118px + env(safe-area-inset-bottom))}
.pc-zone.right .reset{right:118px;bottom:calc(118px + env(safe-area-inset-bottom))}
#feelPage.active{display:flex;flex-direction:column;height:100%;background:#0a0e1a;overflow:hidden}
#feelLayout{flex:1 1 auto;display:flex;flex-direction:row;min-height:0;overflow:hidden}
#feelParams{width:380px;min-width:380px;overflow-y:auto;padding:16px;border-right:1px solid #1a2a3a;background:#0f1420;flex-shrink:0}
.feel-title{font-size:14px;color:#00ffaa;padding-bottom:10px;border-bottom:1px solid #1a2a3a;margin-bottom:14px;letter-spacing:1px}
.feel-section{margin-bottom:16px}
.feel-section h3{font-size:12px;color:#00ffaa;margin-bottom:10px;font-weight:normal;padding:5px 0;border-bottom:1px dashed #1a2a3a;letter-spacing:1px}
.feel-row{padding:8px 0;border-bottom:1px solid #0a0e1a}
.feel-row .rowhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.feel-row label{flex:1;font-size:13px;color:#aac4d6}
.feel-row input[type=number]{width:84px;background:#0a0e1a;color:#c0d0e0;border:1px solid #2a3a4a;border-radius:3px;padding:7px 8px;font-size:13px;outline:none;text-align:right}

<body>
<div id="app">
  <header id="header">
    <span class="logo">拼死跳跃</span>
    <div class="tabs">
      <div class="tab active" data-page="edit">编辑</div>
      <div class="tab" data-page="feel">手感</div>
    </div>

      <button class="tb-btn" id="btnAddLevel">＋</button>
      <button class="tb-btn danger" id="btnDelLevel">✕</button>
      <input type="text" id="levelNameInput" placeholder="关卡名" maxlength="20">
      <span style="color:#ff4466;font-size:14px;flex-shrink:0">❤️</span>
      <input type="number" id="lvLives" min="1" max="20" value="3">
      <span style="color:#ffdd44;font-size:14px;flex-shrink:0">🚩</span>
      <input type="number" id="lvFlags" min="0" max="9" value="0">
      <select id="chamberRef" title="扩展参考箱庭 / 背景画布"></select>
      <button class="tb-btn" id="btnCameraConfig"><span class="icon">📷</span><span class="text-opt">相机</span></button>
      <div class="right">
        <button class="tb-btn" id="btnUndo"><span class="icon">↶</span><span class="text-opt">撤销</span></button>
        <button class="tb-btn" id="btnRedo"><span class="icon">↷</span><span class="text-opt">重做</span></button>
        <button class="tb-btn danger" id="btnClear"><span class="icon">✕</span><span class="text-opt">清空</span></button>
        <button class="tb-btn" id="btnOpen"><span class="icon">📂</span><span class="text-opt">打开</span></button>
        <button class="tb-btn primary" id="btnSave"><span class="icon">💾</span><span class="text-opt">保存</span></button>
        <button class="tb-btn play" id="btnPlay"><span class="icon">▶</span><span class="text-opt">试玩</span></button>
      </div>
    </div>
    <div id="feelTools" style="display:none;align-items:center;gap:8px;margin-left:auto">
      <button class="tb-btn" id="btnFeelReset">恢复默认</button>
      <button class="tb-btn" id="btnFeelImport">导入</button>
      <button class="tb-btn primary" id="btnFeelExport">导出</button>
    </div>
  </header>

  <div id="editPage" class="page active">
    <div id="main">
      <div id="canvasWrap">

        <div id="layerCtrl">
          <span class="lbl">编辑层</span>
          <div id="layerList"></div>
        </div>
        <div id="zoomControls">
          <button id="btnZoomOut">−</button>
          <span id="zoomVal">100%</span>
          <button id="btnZoomIn">＋</button>
          <button id="btnZoomFit">⤢</button>
          <button id="btnZoomHome">⌂</button>
        </div>
        <div id="chamberCtrl">
          <div class="lbl" id="chamberCtrlLbl">箱庭</div>
          <button id="btnAddRight">▶ 右</button>
          <button id="btnAddLeft">◀ 左</button>
          <button id="btnAddUp">▲ 上</button>
          <button id="btnAddDown">▼ 下</button>
          <button id="btnDelChamber" class="danger">✕ 删</button>
        </div>
        <div id="selectionBar"></div>
      </div>
      <aside id="palette"></aside>
      <aside id="inspector">
        <div class="ins-title">属性</div>
        <div id="inspectorBody"><div class="ins-empty">未选中元素</div></div>
      </aside>
    </div>
    <footer id="status">
      <span><span class="k">X:</span> <span class="v" id="statX">0</span></span>
      <span><span class="k">Y:</span> <span class="v" id="statY">0</span></span>
      <span><span class="k">网格:</span> <span class="v" id="statGrid">8</span></span>
      <span><span class="k">缩放:</span> <span class="v" id="statZoom">100%</span></span>
      <div class="right">
        <span><span class="k">箱庭:</span> <span class="v" id="statChambers">1</span></span>
        <span><span class="k">元素:</span> <span class="v" id="statCount">0</span></span>
        <span><span class="k">选中:</span> <span class="v" id="statSel">0</span></span>
      </div>
    </footer>
  </div>

  <div id="feelPage" class="page">
    <div id="feelLayout">
      <div id="feelParams">
        <div class="feel-title">手感参数</div>
        <div class="feel-section"><h3>移动</h3><div id="feelMoveRows"></div></div>
        <div class="feel-section"><h3>跳跃</h3><div id="feelJumpRows"></div></div>
        <div class="feel-section"><h3>空中 / 容错</h3><div id="feelAirRows"></div></div>
        <div class="feel-actions">
          <button id="btnFeelSave" class="primary">保存并应用</button>

        </div>
      </div>

        <canvas id="feelPreviewCanvas"></canvas>

        <div id="feelTestKeys">

          <span><kbd>W</kbd> 跳跃</span>
          <span><kbd>R</kbd> 重置</span>
          <span><kbd>ESC</kbd> 退出</span>
        </div>

        </div>
      </div>
    </div>

    <div class="cam-row"><label>下死区比例</label><input type="range" id="camYB" min="0.55" max="0.95" step="0.01" value="0.68"><input type="number" id="camYBN" min="0.55" max="0.95" step="0.01" value="0.68"></div>
    <div class="cam-row"><label>视野宽度</label><input type="range" id="camVW" min="100" max="400" step="10" value="300"><input type="number" id="camVWN" min="100" max="400" step="10" value="300"></div>
    <div class="cam-row"><label>视野高度</label><input type="range" id="camVH" min="80" max="300" step="10" value="100"><input type="number" id="camVHN" min="80" max="300" step="10" value="100"></div>

  </div>
</div>

<script>

function sanitizeFeel(obj){
  var out=JSON.parse(JSON.stringify(FEEL_DEFAULTS));

}

function init(){
  cacheDom();

  buildPalette();
  initDefaultLevels();
  bindEvents();
  refreshLevelSelect();
  loadLevelToUI(0);
  detectMobile();
  resizeCanvas();
  buildFeelUI();
  bindFeelIOModal();
  bindTouchControls();
  bindFeelTouchControls();
  bindPropertySheet();
  bindCameraModal();
  // select 增强：点击前确保选中项居中
  (function enhanceSelects(){
    var sels=document.querySelectorAll('select');
    for(var i=0;i<sels.length;i++){
      var sel=sels[i];
      if(sel._enhanced)continue;
      sel._enhanced=true;
      sel.addEventListener('mousedown',function(){
        var idx=this.selectedIndex;
        if(idx>0){
          var self=this;
          // 通过临时改变选中项触发浏览器定位
          setTimeout(function(){
            try{ self.options[idx].selected=true; }catch(e){}
          },0);
        }
      });
    }
  })();
  requestAnimationFrame(loop);
}

/* ============ 背景层工具函数 ============ */
function getCurrentBg(){
  if(Ed.currentLayer==='game')return null;
  var lv=Ed.levels[Ed.currentIdx];
  if(!lv||!lv.backgrounds)return null;
  var id=Ed.currentLayer.slice(3);
  for(var i=0;i<lv.backgrounds.length;i++)if(lv.backgrounds[i].id===id)return lv.backgrounds[i];
  return null;
}
function getCurrentBgIndex(){
  if(Ed.currentLayer==='game')return -1;
  var lv=Ed.levels[Ed.currentIdx];
  if(!lv||!lv.backgrounds)return -1;
  var id=Ed.currentLayer.slice(3);
  for(var i=0;i<lv.backgrounds.length;i++)if(lv.backgrounds[i].id===id)return i;
  return -1;
}
function getBgShapeRef(shape){
  var lv=Ed.levels[Ed.currentIdx];if(!lv||!lv.backgrounds)return null;
  for(var i=0;i<lv.backgrounds.length;i++){
    var bg=lv.backgrounds[i];
    var arr=bg.shapes||[];
    for(var j=0;j<arr.length;j++)if(arr[j]===shape)return{bg:bg,shape:shape};
  }
  return null;
}
function getBgCanvasRef(bc){
  var lv=Ed.levels[Ed.currentIdx];if(!lv||!lv.backgrounds)return null;
  for(var i=0;i<lv.backgrounds.length;i++){
    var bg=lv.backgrounds[i];
    var arr=bg.chambers||[];
    for(var j=0;j<arr.length;j++)if(arr[j]===bc)return{bg:bg,canvas:bc};
  }
  return null;
}

  var sel=document.createElement('div');

/* ============ 层级切换器 ============ */
function rebuildLayerList(){
  if(!D.layerList)return;
  var lv=Ed.levels[Ed.currentIdx];
  if(!lv){D.layerList.innerHTML='';return;}
  if(!lv.backgrounds)lv.backgrounds=[];
  if(Ed.currentLayer!=='game'){
    var found=false;
    lv.backgrounds.forEach(function(bg){if('bg:'+bg.id===Ed.currentLayer)found=true;});
    if(!found)Ed.currentLayer='game';
  }
  var sorted=lv.backgrounds.slice().sort(function(a,b){return (b.layer||0)-(a.layer||0);});
  var html='';
  html+='<button data-layer="game" class="'+(Ed.currentLayer==='game'?'active':'')+'">🎮 游戏</button>';
  sorted.forEach(function(bg){
    var sel=Ed.currentLayer==='bg:'+bg.id;
    html+='<button data-layer="bg:'+bg.id+'" class="'+(sel?'bg-active':'')+'">背景 L'+(bg.layer||0)+'</button>';
  });
  html+='<button data-action="add" class="layer-add">＋ 新层</button>';
  if(Ed.currentLayer!=='game'){
    html+='<button data-action="del" class="layer-del">✕ 删本层</button>';
  }
  D.layerList.innerHTML=html;
  D.layerList.querySelectorAll('button').forEach(function(btn){
    btn.onclick=function(){
      var action=btn.getAttribute('data-action');
      if(action==='add'){addBackgroundLayer();return;}
      if(action==='del'){delCurrentBackgroundLayer();return;}
      var newLayer=btn.getAttribute('data-layer');
      if(newLayer===Ed.currentLayer)return;
      Ed.currentLayer=newLayer;
      Ed.selection=[];Ed.action=null;Ed.textDragTarget=null;
      Ed.currentBgChamberRef=0;
      rebuildLayerList();
      buildPalette();
      refreshChamberRef();
      D.chamberCtrlLbl.textContent=(Ed.currentLayer==='game')?'箱庭':'背景画布';
      updateInspector();updateCounts();
      fitZoom();
      toast(newLayer==='game'?'编辑层：游戏场景':'编辑层：背景');
    };
  });
}
function addBackgroundLayer(){
  var lv=Ed.levels[Ed.currentIdx];
  if(!lv)return;
  if(!lv.backgrounds)lv.backgrounds=[];
  var maxLayer=-1;
  lv.backgrounds.forEach(function(bg){if((bg.layer||0)>maxLayer)maxLayer=bg.layer||0;});
  var newLayer=maxLayer+1;
  var id='bg_'+Date.now().toString(36).slice(-5);
  lv.backgrounds.push({
    id:id,
    layer:newLayer,
    chambers:[{id:'bc_'+Date.now().toString(36).slice(-4),x:0,y:0,w:BG_CHAMBER_W,h:BG_CHAMBER_H}],
    shapes:[]
  });
  pushUndo();
  Ed.currentLayer='bg:'+id;
  Ed.currentBgChamberRef=0;
  Ed.selection=[];
  Ed._lastLayerSig=null;
  rebuildLayerList();
  buildPalette();
  refreshChamberRef();
  D.chamberCtrlLbl.textContent='背景画布';
  updateInspector();updateCounts();
  fitZoom();
  toast('已新建背景层 L'+newLayer);
}
function delCurrentBackgroundLayer(){
  var idx=getCurrentBgIndex();
  if(idx<0)return;
  var lv=Ed.levels[Ed.currentIdx];
  if(!confirm('删除当前背景层？（其中的画布和图形都会一起删除）'))return;
  pushUndo();
  lv.backgrounds.splice(idx,1);
  Ed.currentLayer='game';
  Ed.selection=[];
  Ed._lastLayerSig=null;
  rebuildLayerList();
  buildPalette();
  refreshChamberRef();
  D.chamberCtrlLbl.textContent='箱庭';
  updateInspector();updateCounts();
  fitZoom();
  toast('已删除背景层');
}
function getLayerSignature(){
  var lv=Ed.levels[Ed.currentIdx];if(!lv)return '';
  if(!lv.backgrounds)return '';
  return lv.backgrounds.map(function(bg){return bg.id+':'+(bg.layer||0)+':'+((bg.shapes||[]).length)+':'+((bg.chambers||[]).length);}).join('|');
}

function refreshChamberRef(){
  D.chamberRef.innerHTML='';

  if(Ed.currentLayer==='game'){

    var bg=getCurrentBg();

      bg.chambers.push({id:'bc_'+Date.now().toString(36).slice(-4),x:0,y:0,w:BG_CHAMBER_W,h:BG_CHAMBER_H});
    }
    if(Ed.currentBgChamberRef<0)Ed.currentBgChamberRef=0;
    if(Ed.currentBgChamberRef>bg.chambers.length-1)Ed.currentBgChamberRef=bg.chambers.length-1;
    bg.chambers.forEach(function(c,i){
      var opt=document.createElement('option');opt.value=i;opt.textContent='画布'+(i+1);
      D.chamberRef.appendChild(opt);

function loadLevelToUI(idx){

function getWorldBounds(){
  var lv=Ed.levels[Ed.currentIdx];if(!lv)return{minX:0,minY:0,maxX:CHAMBER_W,maxY:CHAMBER_H};
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  if(Ed.currentLayer==='game'){
    lv.chambers.forEach(function(c){
      if(c.x<minX)minX=c.x;if(c.y<minY)minY=c.y;
      if(c.x+c.w>maxX)maxX=c.x+c.w;if(c.y+c.h>maxY)maxY=c.y+c.h;
    });
    lv.elements.forEach(function(el){
      if(el.type==='bg')return;
      var w=el.w||8,h=el.h||8;
      if(el.x<minX)minX=el.x;if(el.y<minY)minY=el.y;
      if(el.x+w>maxX)maxX=el.x+w;if(el.y+h>maxY)maxY=el.y+h;
    });
  }else{
    var bg=getCurrentBg();
    if(bg){
      (bg.chambers||[]).forEach(function(c){
        if(c.x<minX)minX=c.x;if(c.y<minY)minY=c.y;
        if(c.x+c.w>maxX)maxX=c.x+c.w;if(c.y+c.h>maxY)maxY=c.y+c.h;
      });
      (bg.shapes||[]).forEach(function(sh){
        var w=sh.w||8,h=sh.h||8;
        if(sh.x<minX)minX=sh.x;if(sh.y<minY)minY=sh.y;
        if(sh.x+w>maxX)maxX=sh.x+w;if(sh.y+h>maxY)maxY=sh.y+h;
      });
    }
  }
  if(!isFinite(minX))return{minX:0,minY:0,maxX:CHAMBER_W,maxY:CHAMBER_H};
  return{minX:minX,minY:minY,maxX:maxX,maxY:maxY};
}
function fitZoom(){
  if(!canvas||!D.canvasWrap)return;
  var b=getWorldBounds();
  var w=Math.max(1,b.maxX-b.minX),h=Math.max(1,b.maxY-b.minY);
  var rect=D.canvasWrap.getBoundingClientRect();
  if(rect.width<1||rect.height<1)return;
  Ed.zoom=Math.max(0.3,Math.min((rect.width-40)/w,(rect.height-40)/h,10));
  Ed.pan.x=(rect.width-w*Ed.zoom)/2-b.minX*Ed.zoom;
  Ed.pan.y=(rect.height-h*Ed.zoom)/2-b.minY*Ed.zoom;
  updateZoomDisplay();
}
function updateZoomDisplay(){
  D.zoomVal.textContent=Math.round(Ed.zoom*100)+'%';
  D.statZoom.textContent=Math.round(Ed.zoom*100)+'%';
}
function resizeCanvas(){
  if(!canvas||!D.canvasWrap)return;
  var rect=D.canvasWrap.getBoundingClientRect();
  if(rect.width<1||rect.height<1)return;
  canvas.width=Math.floor(rect.width*dpr);
  canvas.height=Math.floor(rect.height*dpr);
  canvas.style.width=rect.width+'px';
  canvas.style.height=rect.height+'px';
}

/* ============ 编辑器事件 ============ */
function screenToWorld(sx,sy){return{x:(sx-Ed.pan.x)/Ed.zoom,y:(sy-Ed.pan.y)/Ed.zoom};}
function getCanvasLocal(clientX,clientY){var rect=canvas.getBoundingClientRect();return{sx:clientX-rect.left,sy:clientY-rect.top};}
function snap(v){if(!Ed.snap)return Math.round(v);return Math.round(v/Ed.grid)*Ed.grid;}
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function pickElement(wx,wy,extraPadding){
  var pad=extraPadding||0;
  var lv=Ed.levels[Ed.currentIdx];if(!lv)return null;
  if(Ed.currentLayer==='game'){
    var els=lv.elements;
    for(var i=els.length-1;i>=0;i--){
      var el=els[i];
      if(el.type==='bg')continue;
      var w=el.w||8,h=el.h||8;
      if(wx>=el.x-pad&&wx<=el.x+w+pad&&wy>=el.y-pad&&wy<=el.y+h+pad)return el;
    }
    return null;
  }
  var bg=getCurrentBg();if(!bg)return null;
  var shapes=bg.shapes||[];
  for(var j=shapes.length-1;j>=0;j--){
    var sh=shapes[j];
    var w2=sh.w||8,h2=sh.h||8;
    if(wx>=sh.x-pad&&wx<=sh.x+w2+pad&&wy>=sh.y-pad&&wy<=sh.y+h2+pad)return sh;
  }
  var bcs=bg.chambers||[];
  for(var k=bcs.length-1;k>=0;k--){
    var bc=bcs[k];
    if(wx>=bc.x-pad&&wx<=bc.x+bc.w+pad&&wy>=bc.y-pad&&wy<=bc.y+bc.h+pad)return bc;
  }
  return null;
}
function pickGameChamber(wx,wy){
  var lv=Ed.levels[Ed.currentIdx];if(!lv||!lv.chambers)return -1;
  for(var i=lv.chambers.length-1;i>=0;i--){
    var c=lv.chambers[i];
    if(wx>=c.x&&wx<=c.x+c.w&&wy>=c.y&&wy<=c.y+c.h)return i;
  }
  return -1;
}
function pickBgCanvas(wx,wy){
  var bg=getCurrentBg();if(!bg||!bg.chambers)return -1;
  for(var i=bg.chambers.length-1;i>=0;i--){
    var c=bg.chambers[i];
    if(wx>=c.x&&wx<=c.x+c.w&&wy>=c.y&&wy<=c.y+c.h)return i;
  }
  return -1;
}
function getLabelTextPos(el){
  var w=el.w||8,h=el.h||8;
  return {x: el.x + w/2 + (el.textOffsetX||0), y: el.y + h/2 + (el.textOffsetY!==undefined?el.textOffsetY:-22)};
}

function switchPage(page){

  D.feelPage.classList.toggle('active',page==='feel');

function onMouseDown(e){
  if(e.button===1||(e.button===0&&Ed.spaceDown)){Ed.panning={sx:e.clientX,sy:e.clientY,px:Ed.pan.x,py:Ed.pan.y};e.preventDefault();return;}
  if(e.button!==0)return;
  handlePointerDown(getCanvasLocal(e.clientX,e.clientY),e.shiftKey);
}
function onMouseMove(e){
  if(Ed.panning){Ed.pan.x=Ed.panning.px+(e.clientX-Ed.panning.sx);Ed.pan.y=Ed.panning.py+(e.clientY-Ed.panning.sy);return;}
  handlePointerMove(getCanvasLocal(e.clientX,e.clientY));
}
function onMouseUp(e){if(Ed.panning){Ed.panning=null;return;}if(Ed.action)Ed.action=null;Ed.textDragTarget=null;}
var touchState={mode:null,lastTapEl:null,lastTapTime:0,panStartX:0,panStartY:0,panStartPanX:0,panStartPanY:0,pinchStartDist:0,pinchStartZoom:1,pinchMidX:0,pinchMidY:0,pinchStartPanX:0,pinchStartPanY:0};
function onTouchStart(e){
  if(e.touches.length===1){
    var t=e.touches[0];var pos=getCanvasLocal(t.clientX,t.clientY);
    var now=Date.now();var world=screenToWorld(pos.sx,pos.sy);
    var hitEl=pickElement(world.x,world.y,6/Ed.zoom);
    if(hitEl&&touchState.lastTapEl===hitEl&&now-touchState.lastTapTime<400){
      Ed.selection=[hitEl];updateInspector();openPropertySheet();
      touchState.lastTapEl=null;touchState.lastTapTime=0;e.preventDefault();return;
    }
    touchState.lastTapEl=hitEl;touchState.lastTapTime=now;
    if(Ed.tool!=='select'){touchState.mode='edit';handlePointerDown(pos,false);e.preventDefault();}
    else if(hitEl){touchState.mode='edit';handlePointerDown(pos,false);e.preventDefault();}
    else{
      touchState.mode='pan';
      touchState.panStartX=t.clientX;touchState.panStartY=t.clientY;
      touchState.panStartPanX=Ed.pan.x;touchState.panStartPanY=Ed.pan.y;
      if(Ed.selection.length>0){Ed.selection=[];updateInspector();}
      if(Ed.currentLayer==='game'){
        var ci0=pickGameChamber(world.x,world.y);
        if(ci0>=0&&ci0!==Ed.chamberRefIdx){Ed.chamberRefIdx=ci0;refreshChamberRef();}
      }else{
        var bc0=pickBgCanvas(world.x,world.y);
        if(bc0>=0&&bc0!==Ed.currentBgChamberRef){Ed.currentBgChamberRef=bc0;refreshChamberRef();}
      }
      e.preventDefault();
    }
  }else if(e.touches.length===2){
    touchState.mode='pinch';
    touchState.pinchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    touchState.pinchStartZoom=Ed.zoom;
    touchState.pinchMidX=(e.touches[0].clientX+e.touches[1].clientX)/2;
    touchState.pinchMidY=(e.touches[0].clientY+e.touches[1].clientY)/2;
    touchState.pinchStartPanX=Ed.pan.x;touchState.pinchStartPanY=Ed.pan.y;
    e.preventDefault();
  }
}
function onTouchMove(e){
  if(touchState.mode==='pan'&&e.touches.length===1){
    var t=e.touches[0];
    Ed.pan.x=touchState.panStartPanX+(t.clientX-touchState.panStartX);
    Ed.pan.y=touchState.panStartPanY+(t.clientY-touchState.panStartY);
    e.preventDefault();return;
  }
  if(touchState.mode==='edit'&&e.touches.length===1){
    handlePointerMove(getCanvasLocal(e.touches[0].clientX,e.touches[0].clientY));
    e.preventDefault();return;
  }
  if(touchState.mode==='pinch'&&e.touches.length===2){
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    var newZoom=Math.max(0.3,Math.min(24,touchState.pinchStartZoom*(d/touchState.pinchStartDist)));
    var canvasRect=canvas.getBoundingClientRect();
    var mx=touchState.pinchMidX-canvasRect.left;var my=touchState.pinchMidY-canvasRect.top;
    var wx=(mx-touchState.pinchStartPanX)/touchState.pinchStartZoom;
    var wy=(my-touchState.pinchStartPanY)/touchState.pinchStartZoom;
    Ed.zoom=newZoom;Ed.pan.x=mx-wx*Ed.zoom;Ed.pan.y=my-wy*Ed.zoom;
    updateZoomDisplay();e.preventDefault();
  }
}
function onTouchEnd(e){
  if(touchState.mode==='edit'){if(Ed.action)Ed.action=null;Ed.textDragTarget=null;touchState.mode=null;return;}
  if(touchState.mode==='pan'){touchState.mode=null;return;}
  if(touchState.mode==='pinch'){touchState.mode=null;return;}
}
function pickLabelTextHandle(wx,wy){
  if(Ed.selection.length!==1)return false;
  var el=Ed.selection[0];
  if(el.type!=='label')return false;
  var tp=getLabelTextPos(el);
  var hs=12/Ed.zoom;
  return Math.abs(wx-tp.x)<hs*2 && Math.abs(wy-tp.y)<hs;
}
function handlePointerDown(pos,shiftKey){
  var wx=(pos.sx-Ed.pan.x)/Ed.zoom;var wy=(pos.sy-Ed.pan.y)/Ed.zoom;
  if(Ed.currentLayer==='game'){
    var ci=pickGameChamber(wx,wy);
    if(ci>=0&&ci!==Ed.chamberRefIdx){Ed.chamberRefIdx=ci;refreshChamberRef();}
  }else{
    var bc=pickBgCanvas(wx,wy);
    if(bc>=0&&bc!==Ed.currentBgChamberRef){Ed.currentBgChamberRef=bc;refreshChamberRef();}
  }
  if(Ed.tool==='select'){
    if(pickLabelTextHandle(wx,wy)){
      var el=Ed.selection[0];
      pushUndo();
      Ed.textDragTarget=el;
      Ed.action={mode:'textmove',startWX:wx,startWY:wy,origTextX:el.textOffsetX||0,origTextY:(el.textOffsetY!==undefined?el.textOffsetY:-22)};
      return;
    }
    if(Ed.selection.length===1){
      var handle=pickHandle(wx,wy);
      if(handle){pushUndo();Ed.action={mode:'resize',handle:handle,startWX:wx,startWY:wy,origs:Ed.selection.map(snapshotEl)};return;}
    }
    var el2=pickElement(wx,wy,6/Ed.zoom);
    if(el2){
      if(shiftKey){var idx=Ed.selection.indexOf(el2);if(idx>=0)Ed.selection.splice(idx,1);else Ed.selection.push(el2);}
      else if(Ed.selection.indexOf(el2)<0)Ed.selection=[el2];
      pushUndo();Ed.action={mode:'move',startWX:wx,startWY:wy,origs:Ed.selection.map(snapshotEl)};
    }else if(!shiftKey)Ed.selection=[];
    updateInspector();
  }else{
    var t=TOOLS[Ed.tool];if(!t)return;
    pushUndo();
    if(Ed.tool==='bgCanvas'){
      var bg=getCurrentBg();
      if(!bg){toast('请先创建背景层');Ed.undoStack.pop();return;}
      var d=t.defaults;var nx=snap(wx-d.w/2),ny=snap(wy-d.h/2);
      var newBC={type:'bgCanvas',id:'bc_'+Date.now().toString(36).slice(-4),x:nx,y:ny,w:d.w,h:d.h};
      if(!bg.chambers)bg.chambers=[];
      bg.chambers.push(newBC);
      Ed._lastLayerSig=null;
      setTool('select');Ed.selection=[newBC];
      updateInspector();updateCounts();refreshChamberRef();
      return;
    }
    if(Ed.tool==='bgShape'){
      var bg2=getCurrentBg();
      if(!bg2){toast('请先创建背景层');Ed.undoStack.pop();return;}
      if(!bg2.chambers||bg2.chambers.length===0){toast('请先创建背景画布');Ed.undoStack.pop();return;}
      var refIdx=Math.min(Ed.currentBgChamberRef,bg2.chambers.length-1);
      if(refIdx<0)refIdx=0;
      var refBC=bg2.chambers[refIdx];
      var d2=t.defaults;
      var nx2=snap(wx-d2.w/2),ny2=snap(wy-d2.h/2);
      var newSh={type:'bgShape',chamberId:refBC.id,x:nx2,y:ny2,w:d2.w,h:d2.h,shape:d2.shape,shader:d2.shader,color:d2.color,color2:d2.color2,glow:d2.glow,alpha:d2.alpha,rotation:d2.rotation,points:d2.points,speed:(typeof d2.speed==='number'?d2.speed:1)};
      if(!bg2.shapes)bg2.shapes=[];
      bg2.shapes.push(newSh);
      Ed._lastLayerSig=null;
      setTool('select');Ed.selection=[newSh];
      updateInspector();updateCounts();
      return;
    }
    var t2=TOOLS[Ed.tool];
    var d3=t2.defaults;var nx3=snap(wx-d3.w/2),ny3=snap(wy-d3.h/2);
    var newEl={type:t2.realType||Ed.tool,x:nx3,y:ny3};
    for(var k in d3)newEl[k]=d3[k];
    if(newEl.type==='door')newEl.id='door_'+Date.now().toString(36).slice(-4);
    if(newEl.type==='trophy')newEl.id='trophy_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
    if(newEl.type==='plate'&&newEl.targetId===undefined)newEl.targetId='';
    Ed.levels[Ed.currentIdx].elements.push(newEl);
    setTool('select');Ed.selection=[newEl];
    updateInspector();updateCounts();
  }
}
function handlePointerMove(pos){
  var m={x:(pos.sx-Ed.pan.x)/Ed.zoom,y:(pos.sy-Ed.pan.y)/Ed.zoom};
  D.statX.textContent=Math.round(m.x);D.statY.textContent=Math.round(m.y);
  if(Ed.action){
    var dwx=m.x-Ed.action.startWX,dwy=m.y-Ed.action.startWY;
    if(Ed.action.mode==='move'){
      var orig0=Ed.action.origs[0];
      var snapOffsetX=snap(orig0.x+dwx)-(orig0.x+dwx);
      var snapOffsetY=snap(orig0.y+dwy)-(orig0.y+dwy);
      for(var i=0;i<Ed.selection.length;i++){
        var el=Ed.selection[i];var orig=Ed.action.origs[i];
        el.x=orig.x+dwx+snapOffsetX;el.y=orig.y+dwy+snapOffsetY;
      }
    }else if(Ed.action.mode==='resize'){
      for(var j=0;j<Ed.selection.length;j++)applyResize(Ed.selection[j],Ed.action.origs[j],dwx,dwy,Ed.action.handle);
    }else if(Ed.action.mode==='textmove'){
      var el2=Ed.selection[0];
      el2.textOffsetX=Math.round(Ed.action.origTextX+dwx);
      el2.textOffsetY=Math.round(Ed.action.origTextY+dwy);
    }
    updateInspector();
  }else{
    Ed.hover=(Ed.tool==='select')?pickElement(m.x,m.y,6/Ed.zoom):null;
  }
}
function onWheel(e){
  e.preventDefault();
  var factor=e.deltaY<0?1.15:1/1.15;
  var rect=canvas.getBoundingClientRect();
  var sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  var wx=(sx-Ed.pan.x)/Ed.zoom,wy=(sy-Ed.pan.y)/Ed.zoom;
  Ed.zoom=Math.max(0.3,Math.min(24,Ed.zoom*factor));
  Ed.pan.x=sx-wx*Ed.zoom;Ed.pan.y=sy-wy*Ed.zoom;
  updateZoomDisplay();
}
function zoomBy(f){
  var rect=canvas.getBoundingClientRect();
  var sx=rect.width/2,sy=rect.height/2;
  var wx=(sx-Ed.pan.x)/Ed.zoom,wy=(sy-Ed.pan.y)/Ed.zoom;
  Ed.zoom=Math.max(0.3,Math.min(24,Ed.zoom*f));
  Ed.pan.x=sx-wx*Ed.zoom;Ed.pan.y=sy-wy*Ed.zoom;
  updateZoomDisplay();
}
function onKeyDown(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
  if(FeelTest&&FeelTest.active&&(e.code==='KeyA'||e.code==='KeyD'||e.code==='KeyW'||e.code==='ArrowLeft'||e.code==='ArrowRight'||e.code==='ArrowUp')){
    FeelTest.keys[e.code]=true;e.preventDefault();return;
  }
  if(FeelTest&&FeelTest.active&&e.code==='KeyR'){resetFeelTest();e.preventDefault();return;}
  if(FeelTest&&FeelTest.active&&e.code==='Escape'){
    FeelTest.active=false;FeelTest.keys={};
    document.getElementById('feelTestKeys').classList.remove('active');
    document.getElementById('feelPreviewHint').classList.remove('hide');
    D.feelTouchControls.classList.remove('active');
    e.preventDefault();return;
  }
  if(Play.active){
    if(e.code==='Escape'){exitPlay();e.preventDefault();return;}
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code)>=0)e.preventDefault();
    if(e.code==='KeyK'){Play.keys[e.code]=true;doSuicidePlay();e.preventDefault();return;}
    if(e.code==='KeyF'){if(!Play._flagKeyHeld){Play._flagKeyHeld=true;doFlagAction();}e.preventDefault();return;}
    if(e.code==='KeyL'){Play.keys[e.code]=true;for(var i=0;i<Play.ghosts.length;i++)Play.ghosts[i].reset();e.preventDefault();return;}
    Play.keys[e.code]=true;
    return;
  }
  if(Ed.sheetOpen&&e.code==='Escape'){closePropertySheet();e.preventDefault();return;}
  if(e.code==='Space'&&!e.target.closest('input')){Ed.spaceDown=true;e.preventDefault();return;}
  var ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&e.code==='KeyZ'&&!e.shiftKey){e.preventDefault();undo();return;}
  if(ctrl&&(e.code==='KeyY'||(e.code==='KeyZ'&&e.shiftKey))){e.preventDefault();redo();return;}
  if(ctrl&&e.code==='KeyC'){e.preventDefault();copySelection();return;}
  if(ctrl&&e.code==='KeyV'){e.preventDefault();paste();return;}
  if(ctrl&&e.code==='KeyA'){e.preventDefault();selectAll();return;}
  if(ctrl&&e.code==='KeyS'){e.preventDefault();saveFile();return;}
  if(e.code==='Delete'||e.code==='Backspace'){e.preventDefault();deleteSelection();return;}
  if(e.code==='Escape'){Ed.selection=[];updateInspector();return;}
  var dx=0,dy=0;
  if(e.code==='ArrowLeft')dx=-1;
  else if(e.code==='ArrowRight')dx=1;
  else if(e.code==='ArrowUp')dy=-1;
  else if(e.code==='ArrowDown')dy=1;
  if(dx||dy){
    e.preventDefault();if(!Ed.selection.length)return;
    pushUndo();var step=e.shiftKey?1:Ed.grid;
    Ed.selection.forEach(function(el){el.x+=dx*step;el.y+=dy*step;});
    updateInspector();return;
  }
  if(e.code==='KeyG'){Ed.snap=!Ed.snap;D.statGrid.textContent=Ed.snap?Ed.grid:'OFF';return;}
  if(e.code==='Home'){e.preventDefault();fitZoom();return;}
}
function onKeyUp(e){
  if(FeelTest&&FeelTest.active)FeelTest.keys[e.code]=false;
  if(Play.active){Play.keys[e.code]=false;if(e.code==='KeyF')Play._flagKeyHeld=false;}
  if(e.code==='Space')Ed.spaceDown=false;
}
function pickHandle(wx,wy){
  if(Ed.selection.length!==1)return null;
  var el=Ed.selection[0];
  if(el.w===undefined||el.h===undefined)return null;
  var hs=12/Ed.zoom;
  var x=el.x,y=el.y,w=el.w,h=el.h;
  var cx=x+w/2,cy=y+h/2;
  var handles={nw:{x:x,y:y},ne:{x:x+w,y:y},sw:{x:x,y:y+h},se:{x:x+w,y:y+h},n:{x:cx,y:y},s:{x:cx,y:y+h},w:{x:x,y:cy},e:{x:x+w,y:cy}};
  for(var k in handles)if(Math.abs(wx-handles[k].x)<hs&&Math.abs(wy-handles[k].y)<hs)return k;
  return null;
}
function snapshotEl(el){var o={};for(var k in el)o[k]=el[k];return o;}
function applyResize(el,orig,dwx,dwy,handle){
  var x1=orig.x,y1=orig.y,x2=orig.x+orig.w,y2=orig.y+orig.h;
  if(handle.indexOf('w')>=0)x1=snap(orig.x+dwx);
  if(handle.indexOf('e')>=0)x2=snap(orig.x+orig.w+dwx);
  if(handle.indexOf('n')>=0)y1=snap(orig.y+dwy);
  if(handle.indexOf('s')>=0)y2=snap(orig.y+orig.h+dwy);
  if(x2-x1<4)x2=x1+4;
  if(y2-y1<4)y2=y1+4;
  el.x=x1;el.y=y1;el.w=x2-x1;el.h=y2-y1;
}

/* ============ 属性面板 ============ */
function getToolDefForEl(el){
  if(el.type==='bgCanvas')return{key:'bgCanvas',def:TOOLS.bgCanvas};
  if(el.type==='bgShape')return{key:'bgShape',def:TOOLS.bgShape};
  for(var k in TOOLS){
    var t=TOOLS[k];
    if(t.group==='背景')continue;
    if((t.realType||k)===el.type){
      if(t.realType==='plate'&&t.defaults.need!==el.need)continue;
      return{key:k,def:t};
    }
  }
  return null;
}
function updateInspector(){
  var body=D.inspectorBody;var insp=D.inspector;body.innerHTML='';
  updateSelectionBar();
  if(Ed.selection.length===0){insp.classList.remove('show');D.statSel.textContent='0';return;}
  insp.classList.add('show');
  D.statSel.textContent=Ed.selection.length;
  if(Ed.selection.length>1){
    var multi=document.createElement('div');multi.className='ins-empty';multi.textContent='已选中 '+Ed.selection.length+' 个';body.appendChild(multi);
    var b1=document.createElement('button');b1.className='ins-btn';b1.textContent='左对齐';
    b1.onclick=function(){pushUndo();var minX=Math.min.apply(null,Ed.selection.map(function(e){return e.x;}));Ed.selection.forEach(function(e){e.x=minX;});};
    body.appendChild(b1);
    var b2=document.createElement('button');b2.className='ins-btn danger';b2.textContent='删除选中';
    b2.onclick=deleteSelection;body.appendChild(b2);
    return;
  }
  var el=Ed.selection[0];var tool=getToolDefForEl(el);var toolDef=tool?tool.def:null;
  var badge=document.createElement('div');badge.id='typeBadge';badge.textContent=toolDef?toolDef.label:el.type;body.appendChild(badge);
  if(toolDef&&toolDef.desc){var desc=document.createElement('div');desc.className='ins-desc';desc.textContent=toolDef.desc;body.appendChild(desc);}
  addSliderRow(body,'X',el.x,-500,3000,1,function(v){el.x=snap(v);});
  addSliderRow(body,'Y',el.y,-500,2000,1,function(v){el.y=snap(v);});
  if(el.w!==undefined)addSliderRow(body,'宽度',el.w,4,8000,1,function(v){el.w=Math.max(4,v);});
  if(el.h!==undefined)addSliderRow(body,'高度',el.h,3,8000,1,function(v){el.h=Math.max(3,v);});
  if(el.type==='bgShape'){
    var bg=getCurrentBg();
    if(bg&&bg.chambers&&bg.chambers.length){
      var options=bg.chambers.map(function(c,i){return {id:c.id,name:'画布'+(i+1)};});
      addSelectRow(body,'所属画布',el.chamberId||bg.chambers[0].id,options,function(v){el.chamberId=v;});
    }
  }
  if(toolDef&&toolDef.props){
    toolDef.props.forEach(function(prop){
      if(prop.key==='w'||prop.key==='h')return;
      if(prop.key==='chamberId')return;
      if(prop.type==='select'){
        addSelectRow(body,prop.label,el[prop.key]!==undefined?el[prop.key]:(prop.options&&prop.options[0]?prop.options[0].id:''),prop.options||[],function(v){el[prop.key]=v;});
      }else if(prop.type==='color'){
        addColorRow(body,prop.label,el[prop.key]!==undefined?el[prop.key]:'#000000',function(v){el[prop.key]=v;});
      }else if(prop.type==='text'){
        addTextRow(body,prop.label,el[prop.key]!==undefined?el[prop.key]:'',function(v){el[prop.key]=v;});
      }else if(prop.type==='bool'){
        addBoolRow(body,prop.label,el[prop.key]!==undefined?el[prop.key]:false,function(v){el[prop.key]=v;});
      }else{
        var min=prop.min!==undefined?prop.min:0;var max=prop.max!==undefined?prop.max:100;
        var _iv=el[prop.key];if(_iv===undefined){_iv=(prop.key==='speed'?1:min);}addSliderRow(body,prop.label,_iv,min,max,prop.step||1,function(v){el[prop.key]=v;});
      }
    });
  }
  if(el.type==='plate'){
    var doorList=Ed.levels[Ed.currentIdx].elements.filter(function(e){return e.type==='door';});
    if(doorList.length>0){
      var hint=document.createElement('div');hint.className='ins-hint';
      hint.innerHTML='可用门 ID：<br>'+doorList.map(function(d){return '· '+ (d.id||'(未命名)');}).join('<br>');
      body.appendChild(hint);
    }
  }
  if(el.type==='label'){
    var hint3=document.createElement('div');hint3.className='ins-hint';
    hint3.textContent='在画布上拖动“文字手柄”(青色圆圈)可单独移动文字。';
    body.appendChild(hint3);
  }
  var btnDel=document.createElement('button');btnDel.className='ins-btn danger';btnDel.textContent='删除元素';btnDel.onclick=deleteSelection;body.appendChild(btnDel);
  var btnDup=document.createElement('button');btnDup.className='ins-btn';btnDup.textContent='复制元素';
  btnDup.onclick=function(){
    pushUndo();var copy=snapshotEl(el);
    copy.x=snap(copy.x+Ed.grid*2);copy.y=snap(copy.y+Ed.grid*2);
    if(copy.type==='door')copy.id='door_'+Date.now().toString(36).slice(-4);
    if(copy.type==='bgCanvas'){copy.id='bc_'+Date.now().toString(36).slice(-4);}
    if(copy.type==='bgShape'){}
    if(copy.type==='bgCanvas'||copy.type==='bgShape'){
      var bg=getCurrentBg();
      if(bg){
        if(copy.type==='bgCanvas'){if(!bg.chambers)bg.chambers=[];bg.chambers.push(copy);}
        else{if(!bg.shapes)bg.shapes=[];bg.shapes.push(copy);}
      }
      Ed._lastLayerSig=null;
    }else{
      Ed.levels[Ed.currentIdx].elements.push(copy);
    }
    Ed.selection=[copy];updateInspector();updateCounts();
  };
  body.appendChild(btnDup);
}
function addSliderRow(parent,label,value,min,max,step,onChange){
  var row=document.createElement('div');row.className='slider-row';
  row.innerHTML='<label>'+label+'</label><input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'"><span class="slider-val"></span>';
  var inp=row.querySelector('input');var valSpan=row.querySelector('.slider-val');
  valSpan.textContent=value;
  inp.oninput=function(){var v=parseFloat(inp.value);onChange(v);valSpan.textContent=v;};
  parent.appendChild(row);
}
function addTextRow(parent,label,value,onChange){
  var row=document.createElement('div');row.className='ins-row';
  var lb=document.createElement('label');lb.textContent=label;
  var inp=document.createElement('input');inp.type='text';inp.value=value;
  inp.oninput=function(){onChange(inp.value);};
  row.appendChild(lb);row.appendChild(inp);parent.appendChild(row);
}
function addSelectRow(parent,label,value,options,onChange){
  var row=document.createElement('div');row.className='ins-row';
  var lb=document.createElement('label');lb.textContent=label;
  var sel=document.createElement('select');
  options.forEach(function(o){
    var opt=document.createElement('option');opt.value=o.id;opt.textContent=o.name;
    if(o.id===value)opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=function(){onChange(sel.value);};
  row.appendChild(lb);row.appendChild(sel);parent.appendChild(row);
}
function addColorRow(parent,label,value,onChange){
  var row=document.createElement('div');row.className='ins-row';
  var lb=document.createElement('label');lb.textContent=label;
  var wrap=document.createElement('div');wrap.className='color-pick-wrap';
  var inp=document.createElement('input');
  inp.type='color';
  inp.value=value||'#000000';
  var txt=document.createElement('input');
  txt.type='text';
  txt.value=value||'#000000';
  inp.oninput=function(){txt.value=inp.value;onChange(inp.value);};
  txt.oninput=function(){
    var v=txt.value.trim();
    if(/^#[0-9a-fA-F]{6}$/.test(v)){inp.value=v;onChange(v);}
    else if(/^#[0-9a-fA-F]{3}$/.test(v)){
      var r=v[1],g=v[2],b=v[3];
      var full='#'+r+r+g+g+b+b;
      inp.value=full;onChange(full);
    }
  };
  wrap.appendChild(inp);wrap.appendChild(txt);

}

function openPropertySheet(){if(Ed.selection.length===0)return;Ed.sheetOpen=true;D.propertySheet.classList.add('show');renderPropertySheet();}
function closePropertySheet(){Ed.sheetOpen=false;D.propertySheet.classList.remove('show');}
function renderPropertySheet(){
  if(Ed.selection.length===0)return;
  var el=Ed.selection[0];var tool=getToolDefForEl(el);var toolDef=tool?tool.def:null;
  var label=toolDef?toolDef.label:el.type;
  D.psTitle.innerHTML=label+'<small>'+(toolDef&&toolDef.desc?toolDef.desc:'')+'</small>';
  var html='';
  if(toolDef&&toolDef.desc)html+='<div class="ps-hint">'+toolDef.desc+'</div>';
  html+='<div class="ps-group"><div class="ps-group-title">位置</div>';
  html+='<div class="ps-field">'+makePsField('X','x',el.x,-500,3000,1,'')+'</div>';
  html+='<div class="ps-field">'+makePsField('Y','y',el.y,-500,2000,1,'')+'</div>';
  html+='</div>';
  if(el.w!==undefined||el.h!==undefined){
    html+='<div class="ps-group"><div class="ps-group-title">尺寸</div>';
    if(el.w!==undefined)html+='<div class="ps-field">'+makePsField('宽度','w',el.w,4,8000,1,'px')+'</div>';
    if(el.h!==undefined)html+='<div class="ps-field">'+makePsField('高度','h',el.h,3,8000,1,'px')+'</div>';
    html+='</div>';
  }
  if(el.type==='bgShape'){
    var bg=getCurrentBg();
    if(bg&&bg.chambers&&bg.chambers.length){
      var opts=bg.chambers.map(function(c,i){return '<option value="'+c.id+'"'+(el.chamberId===c.id?' selected':'')+'>画布'+(i+1)+'</option>';}).join('');
      html+='<div class="ps-group"><div class="ps-group-title">所属画布</div><div class="ps-field"><div class="ps-field-label"><span>画布</span></div><select class="ps-select" data-prop-key="chamberId">'+opts+'</select></div></div>';
    }
  }
  if(toolDef&&toolDef.props){
    var customProps=toolDef.props.filter(function(p){return p.key!=='w'&&p.key!=='h'&&p.key!=='chamberId';});
    if(customProps.length){
      html+='<div class="ps-group"><div class="ps-group-title">属性</div>';
      customProps.forEach(function(prop){
        if(prop.type==='select'){
          var opts=(prop.options||[]).map(function(o){
            return '<option value="'+o.id+'"'+(el[prop.key]===o.id?' selected':'')+'>'+o.name+'</option>';
          }).join('');
          html+='<div class="ps-field"><div class="ps-field-label"><span>'+prop.label+'</span></div><select class="ps-select" data-prop-key="'+prop.key+'">'+opts+'</select></div>';
        }else if(prop.type==='color'){
          var cval=el[prop.key]||'#000000';
          html+='<div class="ps-field"><div class="ps-field-label"><span>'+prop.label+'</span></div><div class="ps-color-wrap"><input type="color" class="ps-color" data-prop-key="'+prop.key+'" value="'+cval+'"><input type="text" class="ps-color-text" data-prop-key="'+prop.key+'" value="'+cval+'"></div></div>';
        }else if(prop.type==='text'){
          html+='<div class="ps-field"><div class="ps-field-label"><span>'+prop.label+'</span></div><input class="ps-text-input" type="text" data-prop-key="'+prop.key+'" value="'+(el[prop.key]||'')+'"></div>';
        }else if(prop.type==='bool'){
          var _boolVal=!!el[prop.key];
          html+='<div class="ps-field"><div class="ps-field-label"><span>'+prop.label+'</span></div><label style="display:flex;align-items:center;gap:12px;cursor:pointer;padding:8px 0;color:#00ffaa;user-select:none;font-size:15px;"><input class="ps-bool" type="checkbox" data-prop-key="'+prop.key+'"'+(_boolVal?' checked':'')+' style="width:22px;height:22px;accent-color:#00ffaa;cursor:pointer;margin:0;"><span class="ps-bool-label">'+(_boolVal?'开启':'关闭')+'</span></label></div>';
        }else{
          var min=prop.min!==undefined?prop.min:0;var max=prop.max!==undefined?prop.max:100;
          html+='<div class="ps-field">'+makePsField(prop.label,prop.key,el[prop.key]!==undefined?el[prop.key]:min,min,max,prop.step||1,'')+'</div>';
        }
      });
      html+='</div>';
    }
  }
  if(el.type==='plate'){
    var doorList=Ed.levels[Ed.currentIdx].elements.filter(function(e){return e.type==='door';});
    if(doorList.length>0){
      html+='<div class="ps-group"><div class="ps-group-title">可用门 ID</div><div style="font-size:13px;color:#88ccbb;line-height:2.2;padding:6px 0">';
      html+=doorList.map(function(d){return '· '+(d.id||'(未命名)');}).join('<br>');
      html+='</div></div>';
    }
  }
  D.psBody.innerHTML=html;
  D.psBody.querySelectorAll('input[type=range]').forEach(function(inp){
    var key=inp.getAttribute('data-prop-key');
    var valSpan=inp.parentElement.querySelector('.val');
    var numInput=valSpan.querySelector('input');
    inp.oninput=function(){var v=parseFloat(inp.value);el[key]=v;valSpan.childNodes[0].textContent=v;numInput.value=v;updateSelectionBar();};
    numInput.oninput=function(){
      var v=parseFloat(numInput.value);if(isNaN(v))return;
      if(v<parseFloat(inp.min))v=parseFloat(inp.min);
      if(v>parseFloat(inp.max))v=parseFloat(inp.max);
      inp.value=v;el[key]=v;valSpan.childNodes[0].textContent=v;updateSelectionBar();
    };
  });
  D.psBody.querySelectorAll('input.ps-text-input').forEach(function(inp){
    var key=inp.getAttribute('data-prop-key');
    inp.oninput=function(){el[key]=inp.value;};
  });
  D.psBody.querySelectorAll('input.ps-color').forEach(function(inp){
    var key=inp.getAttribute('data-prop-key');
    var txt=D.psBody.querySelector('input.ps-color-text[data-prop-key="'+key+'"]');
    inp.oninput=function(){el[key]=inp.value;if(txt)txt.value=inp.value;};
  });
  D.psBody.querySelectorAll('input.ps-color-text').forEach(function(inp){
    var key=inp.getAttribute('data-prop-key');
    var picker=D.psBody.querySelector('input.ps-color[data-prop-key="'+key+'"]');
    inp.oninput=function(){
      var v=inp.value.trim();
      if(/^#[0-9a-fA-F]{6}$/.test(v)){el[key]=v;if(picker)picker.value=v;}
      else if(/^#[0-9a-fA-F]{3}$/.test(v)){
        var r=v[1],g=v[2],b=v[3];
        var full='#'+r+r+g+g+b+b;
        el[key]=full;if(picker)picker.value=full;
      }
    };
  });
  D.psBody.querySelectorAll('input.ps-bool').forEach(function(inp){
    var key=inp.getAttribute('data-prop-key');
    var label=inp.parentElement.querySelector('.ps-bool-label');
    inp.onchange=function(){
      el[key]=inp.checked;
      if(label)label.textContent=inp.checked?'开启':'关闭';
    };
  });
  D.psBody.querySelectorAll('select.ps-select').forEach(function(sel){
    var key=sel.getAttribute('data-prop-key');
    sel.onchange=function(){el[key]=sel.value;};
  });
}
function makePsField(label,key,value,min,max,step,unit){
  return '<div class="ps-field-label"><span>'+label+'</span><span class="val"><input type="number" min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'">'+(unit?' '+unit:'')+'</span></div><input class="ps-slider" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'" data-prop-key="'+key+'">';
}

/* ============ 编辑操作 ============ */
function pushUndo(){
  var lv=Ed.levels[Ed.currentIdx];if(!lv)return;
  Ed.undoStack.push(JSON.stringify({elements:lv.elements,backgrounds:lv.backgrounds||[]}));
  if(Ed.undoStack.length>100)Ed.undoStack.shift();
  Ed.redoStack=[];
}
function undo(){
  if(!Ed.undoStack.length)return;
  var lv=Ed.levels[Ed.currentIdx];
  Ed.redoStack.push(JSON.stringify({elements:lv.elements,backgrounds:lv.backgrounds||[]}));
  var snap=JSON.parse(Ed.undoStack.pop());
  lv.elements=snap.elements||[];
  lv.backgrounds=snap.backgrounds||[];
  Ed.selection=[];Ed._lastLayerSig=null;
  rebuildLayerList();updateInspector();updateCounts();
}
function redo(){
  if(!Ed.redoStack.length)return;
  var lv=Ed.levels[Ed.currentIdx];
  Ed.undoStack.push(JSON.stringify({elements:lv.elements,backgrounds:lv.backgrounds||[]}));
  var snap=JSON.parse(Ed.redoStack.pop());
  lv.elements=snap.elements||[];
  lv.backgrounds=snap.backgrounds||[];
  Ed.selection=[];Ed._lastLayerSig=null;
  rebuildLayerList();updateInspector();updateCounts();
}
function deleteSelection(){
  if(!Ed.selection.length)return;
  pushUndo();
  Ed.selection.forEach(function(el){
    if(el.type==='bgCanvas'||el.type==='bgShape'){
      var bg=getCurrentBg();
      if(bg){
        if(el.type==='bgCanvas'&&bg.chambers){
          var i=bg.chambers.indexOf(el);if(i>=0)bg.chambers.splice(i,1);
          if(bg.shapes)bg.shapes=bg.shapes.filter(function(sh){return sh.chamberId!==el.id;});
        }
        if(el.type==='bgShape'&&bg.shapes){
          var j=bg.shapes.indexOf(el);if(j>=0)bg.shapes.splice(j,1);
        }
      }
    }else{
      var els=Ed.levels[Ed.currentIdx].elements;
      var k=els.indexOf(el);if(k>=0)els.splice(k,1);
    }
  });

  Ed._lastLayerSig=null;
}

function copySelection(){Ed.clipboard=Ed.selection.map(snapshotEl);toast('已复制 '+Ed.clipboard.length+' 个');}
function paste(){

function addChamber(dir){
  if(Ed.currentLayer==='game'){
    var lv=Ed.levels[Ed.currentIdx];
    if(!lv.chambers||!lv.chambers.length)lv.chambers=[{id:'c1',x:0,y:0,w:CHAMBER_W,h:CHAMBER_H}];
    var refIdx=Math.min(Ed.chamberRefIdx,lv.chambers.length-1);
    if(refIdx<0)refIdx=0;
    var ref=lv.chambers[refIdx];
    var g=Ed.grid;
    var w=Math.round(CHAMBER_W/g)*g;
    var h=Math.round(CHAMBER_H/g)*g;
    var nx,ny;
    if(dir==='right'){nx=Math.round((ref.x+ref.w)/g)*g;ny=Math.round(ref.y/g)*g;}
    else if(dir==='left'){nx=Math.round((ref.x-w)/g)*g;ny=Math.round(ref.y/g)*g;}
    else if(dir==='up'){nx=Math.round(ref.x/g)*g;ny=Math.round((ref.y-h)/g)*g;}
    else{nx=Math.round(ref.x/g)*g;ny=Math.round((ref.y+ref.h)/g)*g;}
    var nc={id:'c'+Date.now().toString(36).slice(-4),x:nx,y:ny,w:w,h:h};
    lv.chambers.push(nc);
    Ed.chamberRefIdx=lv.chambers.length-1;
    refreshChamberRef();
    updateCounts();fitZoom();
    toast('已添加箱庭');
  }else{
    var bg=getCurrentBg();
    if(!bg){toast('请先创建背景层');return;}
    if(!bg.chambers||!bg.chambers.length)bg.chambers=[{id:'bc_'+Date.now().toString(36).slice(-4),x:0,y:0,w:BG_CHAMBER_W,h:BG_CHAMBER_H}];
    var refIdx2=Math.min(Ed.currentBgChamberRef,bg.chambers.length-1);
    if(refIdx2<0)refIdx2=0;
    var ref2=bg.chambers[refIdx2];
    var g2=Ed.grid;
    var w2=Math.round(BG_CHAMBER_W/g2)*g2;
    var h2=Math.round(BG_CHAMBER_H/g2)*g2;
    var nx2,ny2;
    if(dir==='right'){nx2=Math.round((ref2.x+ref2.w)/g2)*g2;ny2=Math.round(ref2.y/g2)*g2;}
    else if(dir==='left'){nx2=Math.round((ref2.x-w2)/g2)*g2;ny2=Math.round(ref2.y/g2)*g2;}
    else if(dir==='up'){nx2=Math.round(ref2.x/g2)*g2;ny2=Math.round((ref2.y-h2)/g2)*g2;}
    else{nx2=Math.round(ref2.x/g2)*g2;ny2=Math.round((ref2.y+ref2.h)/g2)*g2;}
    var nc2={id:'bc_'+Date.now().toString(36).slice(-4),x:nx2,y:ny2,w:w2,h:h2};
    bg.chambers.push(nc2);
    Ed.currentBgChamberRef=bg.chambers.length-1;
    Ed._lastLayerSig=null;
    refreshChamberRef();
    updateCounts();fitZoom();
    toast('已添加背景画布');
  }
}
function delChamber(){
  if(Ed.currentLayer==='game'){
    var lv=Ed.levels[Ed.currentIdx];
    if(!lv.chambers||lv.chambers.length<=1){toast('至少保留一个箱庭');return;}
    var idx=Math.min(Math.max(Ed.chamberRefIdx,0),lv.chambers.length-1);
    if(!confirm('删除箱庭 '+(idx+1)+'？（箱庭内的元素会保留）'))return;
    lv.chambers.splice(idx,1);
    Ed.chamberRefIdx=Math.max(0,Math.min(idx,lv.chambers.length-1));
    refreshChamberRef();
    updateCounts();fitZoom();
    toast('已删除箱庭 '+(idx+1));
  }else{
    var bg=getCurrentBg();
    if(!bg||!bg.chambers||bg.chambers.length<=1){toast('至少保留一个背景画布');return;}
    var idx2=Math.min(Math.max(Ed.currentBgChamberRef,0),bg.chambers.length-1);
    if(!confirm('删除背景画布 '+(idx2+1)+'？（画布内的图形会一起删除）'))return;
    var removed=bg.chambers.splice(idx2,1)[0];
    if(removed&&bg.shapes)bg.shapes=bg.shapes.filter(function(sh){return sh.chamberId!==removed.id;});
    Ed.currentBgChamberRef=Math.max(0,Math.min(idx2,bg.chambers.length-1));
    Ed._lastLayerSig=null;
    refreshChamberRef();
    updateCounts();fitZoom();
    toast('已删除背景画布 '+(idx2+1));
  }
}
function updateCounts(){
  var lv=Ed.levels[Ed.currentIdx];
  if(Ed.currentLayer==='game'){
    D.statCount.textContent=lv.elements.filter(function(e){return e.type!=='bg';}).length;
    D.statChambers.textContent=lv.chambers.length;
  }else{
    var bg=getCurrentBg();
    if(bg){
      D.statCount.textContent=(bg.shapes||[]).length;
      D.statChambers.textContent=(bg.chambers||[]).length;
    }
  }
}
function toast(msg){
  D.toast.textContent=msg;D.toast.classList.add('show');
  clearTimeout(D.toast._t);
  D.toast._t=setTimeout(function(){D.toast.classList.remove('show');},1400);
}

/* ============================================================

function _psMountain(g,x,y,w,h,c1,c2,pulse){

/* ============================================================
